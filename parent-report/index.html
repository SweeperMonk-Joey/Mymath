<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Parent Report · Daily Math Practice</title>
<style>
:root {
    --primary: #4A90D9; --primary-dark: #2E6BB5;
    --correct: #4CAF50; --warning: #F39C12; --error: #E74C3C;
    --bg: #F5F7FA; --card: #FFFFFF; --text: #2C3E50; --muted: #7F8C8D;
    --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px;
}
.wrap { max-width: 860px; margin: 0 auto; }

/* ===== lock screen ===== */
#lockScreen { text-align: center; padding-top: 80px; }
#lockScreen .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px; max-width: 420px; margin: 0 auto;
}
#lockScreen h1 { font-size: 28px; margin-bottom: 20px; }
#passwordInput {
    width: 100%; height: 56px; font-size: 20px; text-align: center;
    border: 3px solid #CBD5E1; border-radius: 12px; outline: none;
    margin-bottom: 14px;
}
#passwordInput:focus { border-color: var(--primary); }
#unlockBtn {
    width: 100%; min-height: 56px; font-size: 20px; font-weight: 700;
    background: var(--primary); color: #fff; border: none; border-radius: 12px;
    cursor: pointer;
}
#unlockBtn:hover { background: var(--primary-dark); }
#lockError { color: var(--error); margin-top: 12px; font-size: 16px; min-height: 20px; }

/* ===== report page ===== */
.hidden { display: none !important; }
header.report-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
header.report-header h1 { font-size: 24px; }
.grade-switch { display: flex; gap: 8px; }
.grade-switch button {
    min-height: 44px; padding: 0 20px; font-size: 16px; font-weight: 700;
    border: 3px solid #CBD5E1; background: #fff; color: var(--text);
    border-radius: 12px; cursor: pointer;
}
.grade-switch button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

.stat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;
}
.stat-card {
    background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    padding: 16px 10px; text-align: center;
}
.stat-value { font-size: 26px; font-weight: 700; color: var(--primary-dark); }
.stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }

.section {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px; margin-bottom: 20px;
}
.section h2 { font-size: 18px; margin-bottom: 14px; }

/* trend chart */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.chart-bar-wrap { width: 100%; display: flex; align-items: flex-end; justify-content: center; height: 150px; }
.chart-bar {
    width: 70%; max-width: 48px; border-radius: 6px 6px 0 0;
    min-height: 4px; position: relative;
}
.chart-bar.green { background: var(--correct); }
.chart-bar.orange { background: var(--warning); }
.chart-bar.red { background: var(--error); }
.chart-bar.gray { background: #D5DBE3; }
.chart-bar span {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; white-space: nowrap;
}
.chart-day { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* topic analysis */
.topic-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF2F6; }
.topic-row:last-child { border-bottom: none; }
.topic-name { width: 130px; font-weight: 600; font-size: 14px; }
.topic-bar-wrap { flex: 1; height: 14px; background: #E8EDF3; border-radius: 7px; overflow: hidden; }
.topic-bar { height: 100%; border-radius: 7px; }
.topic-pct { width: 60px; text-align: right; font-weight: 700; font-size: 14px; }

/* suggestions */
#adviceBox { font-size: 16px; line-height: 1.7; }
#adviceBox li { margin-left: 20px; margin-bottom: 6px; }

.actions { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.btn {
    min-height: 48px; padding: 0 22px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
}
.btn-primary { background: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #E8EDF3; color: var(--text); }

@media (max-width: 600px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .topic-name { width: 100px; }
}
@media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .section, .stat-card { box-shadow: none; border: 1px solid #ddd; }
}
</style>
</head>
<body>
<div class="wrap">

    <!-- password protection -->
    <section id="lockScreen">
        <div class="card">
            <h1>🔒 Parent Report</h1>
            <p style="color:var(--muted);margin-bottom:20px;">Enter password to view progress</p>
            <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
            <button id="unlockBtn">Unlock</button>
            <div id="lockError"></div>
        </div>
    </section>

    <!-- report content -->
    <section id="reportContent" class="hidden">
        <header class="report-header">
            <h1>📊 Parent Report</h1>
            <div class="grade-switch no-print">
                <button id="tab-grade1" class="active">Grade 1</button>
                <button id="tab-grade5">Grade 5</button>
            </div>
        </header>

        <div class="stat-grid" id="statGrid"></div>

        <div class="section">
            <h2>📈 10-Day Trend (First-Try Accuracy)</h2>
            <div class="chart" id="trendChart"></div>
        </div>

        <div class="section">
            <h2>🧩 Topic Analysis (First-Try Accuracy)</h2>
            <div id="topicList"></div>
        </div>

        <div class="section">
            <h2>💡 Suggestions</h2>
            <ul id="adviceBox"></ul>
        </div>

        <div class="actions no-print">
            <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
            <a class="btn btn-secondary" href="../index.html">🏠 Home</a>
        </div>
    </section>

</div>

<script>
'use strict';
const PASSWORD = 'math123';
const GRADES = [
    { key: 'grade1', label: 'Grade 1', total: 50 },
    { key: 'grade5', label: 'Grade 5', total: 20 }
];
const TOTAL_DAYS = 10;
let currentGrade = 'grade1';

/* ---------- unlock ---------- */
function unlock() {
    const input = document.getElementById('passwordInput').value;
    if (input === PASSWORD) {
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('reportContent').classList.remove('hidden');
        loadReport();
    } else {
        document.getElementById('lockError').textContent = '❌ Incorrect password. Try again.';
    }
}
document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

/* ---------- data loading ---------- */
function loadProgress(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

function getGradeData(gradeKey, total) {
    const days = [];
    for (let d = 0; d < TOTAL_DAYS; d++) {
        const p = loadProgress(gradeKey + '_day' + d);
        days.push(p && p.completed ? p : null);
    }
    const completed = days.filter(Boolean);
    let firstCorrect = 0, firstTotal = 0, totalErrors = 0, skips = 0, bonusCorrect = 0, bonusTotal = 0;
    completed.forEach(p => {
        const n = p.answers.length;
        firstCorrect += p.answers.filter(a => a === true).length;
        firstTotal += n;
        totalErrors += (p.errors || []).reduce((s, e) => s + e, 0);
        skips += (p.skipped || []).filter(Boolean).length;
        bonusCorrect += (p.bonusResults || []).filter(Boolean).length;
        bonusTotal += (p.bonusResults || []).length;
    });
    const avgRate = firstTotal > 0 ? Math.round(firstCorrect / firstTotal * 100) : 0;

    // per-day accuracy (null if not completed)
    const dayRates = days.map(p => {
        if (!p) return null;
        const n = p.answers.length;
        return n > 0 ? Math.round(p.answers.filter(a => a === true).length / n * 100) : null;
    });

    return { days, completed, firstCorrect, firstTotal, totalErrors, skips, bonusCorrect, bonusTotal, avgRate, dayRates };
}

/* ---------- render ---------- */
function render() {
    const g = GRADES.find(x => x.key === currentGrade);
    const data = getGradeData(g.key, g.total);
    document.querySelectorAll('.grade-switch button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + currentGrade).classList.add('active');

    // stat cards
    document.getElementById('statGrid').innerHTML = [
        ['✅', data.completed.length + '/' + TOTAL_DAYS + ' days', 'Completed'],
        ['🎯', data.avgRate + '%', 'Avg First-Try Rate'],
        ['👍', data.firstCorrect + '/' + data.firstTotal, 'First-Try Correct'],
        ['❌', data.totalErrors, 'Total Mistakes'],
        ['⏭️', data.skips, 'Skipped'],
        ['⭐', data.bonusCorrect + '/' + data.bonusTotal, 'Bonus Correct']
    ].map(([icon, v, l]) =>
        '<div class="stat-card"><div class="stat-value">' + icon + ' ' + v + '</div><div class="stat-label">' + l + '</div></div>'
    ).join('');

    // trend chart
    const chart = document.getElementById('trendChart');
    chart.innerHTML = data.dayRates.map((rate, i) => {
        const cls = rate === null ? 'gray' : (rate >= 85 ? 'green' : (rate >= 60 ? 'orange' : 'red'));
        const label = rate === null ? '—' : rate + '%';
        const h = rate === null ? 4 : Math.max(rate / 100 * 150, 4);
        return '<div class="chart-col"><div class="chart-bar-wrap"><div class="chart-bar ' + cls + '" style="height:' + h + 'px"><span>' + label + '</span></div></div><div class="chart-day">Day ' + (i + 1) + '</div></div>';
    }).join('');

    // topic analysis: question types are not stored in progress;
    // fallback: aggregate accuracy per day (per-type analysis reserved for future).
    const topicEl = document.getElementById('topicList');
    const completedDays = data.days;
    const dayTopicHtml = completedDays.map((p, i) => {
        if (!p) return '';
        const rate = p.answers.filter(a => a === true).length;
        const pct = Math.round(rate / p.answers.length * 100);
        const cls = pct >= 85 ? 'var(--correct)' : (pct >= 60 ? 'var(--warning)' : 'var(--error)');
        return '<div class="topic-row"><span class="topic-name">Day ' + (i + 1) + '</span>' +
            '<div class="topic-bar-wrap"><div class="topic-bar" style="width:' + pct + '%;background:' + cls + '"></div></div>' +
            '<span class="topic-pct">' + pct + '%</span></div>';
    }).join('');
    if (dayTopicHtml) {
        topicEl.innerHTML = '<div style="color:var(--muted);font-size:13px;margin-bottom:8px;">Per-day accuracy (topic-level analysis requires question bank loading, reserved for future)</div>' + dayTopicHtml;
    } else {
        topicEl.innerHTML = '<p style="color:var(--muted);">No completed days yet. Complete a practice to see topic analysis.</p>';
    }

    // suggestions
    const advice = document.getElementById('adviceBox');
    if (data.completed.length === 0) {
        advice.innerHTML = '<li>No practice completed yet. Start today's practice first!</li>';
    } else if (data.avgRate >= 85) {
        advice.innerHTML = '<li>🎉 Great job! Average first-try accuracy is ' + data.avgRate + '%.</li>' +
            '<li>Increase the challenge: try Grade 5 or timed practice.</li>';
    } else if (data.avgRate >= 60) {
        advice.innerHTML = '<li>👍 Keep practicing! Average is ' + data.avgRate + '%.</li>' +
            '<li>Review the missed questions together and repeat weak days.</li>';
    } else {
        advice.innerHTML = '<li>📚 Average is ' + data.avgRate + '%. Let's review the basics first.</li>' +
            '<li>Redo the days with low accuracy and practice daily.</li>';
    }
}

function loadReport() { render(); }

document.getElementById('tab-grade1').addEventListener('click', () => { currentGrade = 'grade1'; render(); });
document.getElementById('tab-grade5').addEventListener('click', () => { currentGrade = 'grade5'; render(); });
</script>
</body>
</html>
