<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📐 Grade 5 · Daily Math Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-top">
        <span id="grade-label">📐 Grade 5</span>
        <span id="day-label">Day 0</span>
    </div>
    <div class="progress-row">
        <span id="progress-text">Question 1 of 50</span>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
</header>

<main>
    <!-- Foundation & bonus question area -->
    <section id="questionArea" class="card visible">
        <div id="question-type" class="question-type"></div>
        <div id="question-text" class="question-text"></div>

        <!-- Dynamic input area (rendered by app.js renderInputArea() based on answerType) -->
        <div id="input-area" class="input-area">
            <!-- generated by app.js -->
        </div>

        <!-- Bonus question options -->
        <div id="options-area" class="options-area hidden">
            <div id="options-grid" class="options-grid"></div>
        </div>

        <div id="feedback-area" class="feedback-area">
            <div id="feedback-message" class="feedback-message"></div>
            <div id="feedback-explanation" class="feedback-explanation"></div>
        </div>

        <div class="action-row">
            <button id="skipBtn" class="btn btn-warning hidden">⏭️ Skip Question</button>
            <button id="nextBtn" class="btn btn-primary hidden">Next →</button>
        </div>
    </section>

    <!-- Foundation → bonus transition -->
    <section id="transitionArea" class="card hidden">
        <h2>✅ All foundation questions completed!</h2>
        <p>⭐ Starting Bonus Challenge...</p>
        <button id="startBonusBtn" class="btn btn-primary">Continue to Bonus</button>
    </section>

    <!-- Result page -->
    <section id="resultArea" class="card hidden">
        <h1>🎉 Practice Complete!</h1>
        <div id="result-stats" class="result-stats"></div>

        <div id="review-section" class="review-section hidden">
            <button id="reviewToggle" class="review-toggle">▼ Review Mistakes</button>
            <div id="reviewContent" class="review-content hidden"></div>
        </div>

        <div class="result-actions">
            <a href="../parent-report/" class="btn btn-secondary">📊 Parent Report</a>
            <a href="../index.html" class="btn btn-secondary">🏠 Home</a>
        </div>
    </section>

    <!-- Error / not ready -->
    <section id="errorArea" class="card hidden">
        <h2>⏳ Not Ready Yet</h2>
        <p id="errorMessage"></p>
    </section>
</main>

<footer>
    <p class="footer-hint">Enter to submit · Tab between fields</p>
</footer>

<script src="../shared/utils.js"></script>
<script src="app.js"></script>
</body>
</html>
