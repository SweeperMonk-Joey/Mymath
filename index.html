<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Daily Math Practice</title>
<style>
:root {
    --primary: #4A90D9; --primary-dark: #2E6BB5;
    --bg: #F5F7FA; --card: #FFFFFF; --text: #2C3E50; --muted: #7F8C8D;
    --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
}
h1 { font-size: 34px; margin-bottom: 8px; }
.sub { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 640px; width: 100%; }
.card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 32px 20px; text-align: center; text-decoration: none; color: var(--text);
    transition: transform 0.15s;
}
.card:hover { transform: translateY(-3px); }
.card .emoji { font-size: 48px; }
.card .name { font-size: 24px; font-weight: 700; margin: 12px 0 6px; }
.card .desc { color: var(--muted); font-size: 14px; }
.parent-link { margin-top: 24px; }
.parent-link a { color: var(--primary-dark); font-size: 16px; font-weight: 600; text-decoration: none; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>✏️ Daily Math Practice</h1>
<p class="sub">One set of exercises every day, based on Pacific Time</p>

<div class="grid">
    <a class="card" href="grade-1/">
        <div class="emoji">📐</div>
        <div class="name">Grade 1</div>
        <div class="desc">50 questions · multiplication focus</div>
    </a>
    <a class="card" href="grade-5/">
        <div class="emoji">🧮</div>
        <div class="name">Grade 5</div>
        <div class="desc">20 questions · decimals &amp; fractions</div>
    </a>
</div>

<div class="parent-link"><a href="parent-report/">📊 Parent Report</a></div>
</body>
</html>
